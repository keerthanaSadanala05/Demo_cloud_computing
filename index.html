<!DOCTYPE html>
<html>
<head>
    <title>Student Profile Page</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
        }

        .card {
            background: white;
            width: 350px;
            margin: 50px auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        button {
            background-color: blue;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: darkblue;
        }
    </style>
</head>

<body>

    <div class="card">

        <h2>Keerthana Sadanala</h2>

        <p>B.Tech - CSE (AI & ML)</p>

        <p>Interested in Java, AI, and Web Development.</p>

        <button>Contact</button>

    </div>

</body>
</html>
